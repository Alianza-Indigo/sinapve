name: SINAPVE checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - name: Install Chromium for browser tests
        run: corepack pnpm --filter @sinapve/web exec playwright install --with-deps chromium
      - name: End-to-end routes without production data
        run: corepack pnpm --filter @sinapve/web test:e2e
