name: "sinapve_analytics"
version: "1.0.0"
config-version: 2

# EP-13 / 8.1: capa semantica de metricas certificadas. Las gráficas del producto
# derivan de estas definiciones versionadas; ninguna capa recalcula formulas
# distintas. Cada modelo corresponde a una fórmula certificada (8.3) y su
# definicion espeja packages/domain/src/certified-metrics.ts.
profile: "sinapve"

model-paths: ["models"]
seed-paths: ["seeds"]

models:
  sinapve_analytics:
    certified:
      +materialized: view
      +schema: analytics
